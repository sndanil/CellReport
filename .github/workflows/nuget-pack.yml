name: NuGet Pack

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package version override'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cellreport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            framework: net10.0
          - os: windows-latest
            framework: net48
          - os: ubuntu-latest
            framework: net10.0
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET environment
        run: dotnet --info

      - name: Test core
        run: dotnet test Tests/Tests.csproj -c Release -f ${{ matrix.framework }}

  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build CellReport.sln -c Release

  pack:
    needs: [test, build]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version) {
            ./pack.ps1 -Configuration Release -Version $version
          } else {
            ./pack.ps1 -Configuration Release
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-symbols
          path: artifacts/packages/*.snupkg
