name: NuGet Pack

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package version override'
        required: false
        type: string

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version) {
            ./pack.ps1 -Configuration Release -Version $version
          } else {
            ./pack.ps1 -Configuration Release
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-symbols
          path: artifacts/packages/*.snupkg
